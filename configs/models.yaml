# configs/models.yaml
cyber_model:
  cnn:
    filters: [32, 64, 128]
    kernel_sizes: [3, 5, 7]
    dropout: 0.2
    activation: "gelu"
  tcn:
    num_channels: [64, 64, 128]
    kernel_size: 3
    dropout: 0.2
    dilations: [1, 2, 4]
  bigru:
    hidden_size: 64
    num_layers: 1
    bidirectional: true
    dropout: 0.2
  attention:
    embed_dim: 128 # 64 * 2 from BiGRU
    num_heads: 4
    dropout: 0.1
  latent_dim: 64
  quantum_projection_dim: 4 # projected into quantum qubits

hybrid_ensemble:
  meta_classifier:
    type: "logistic_regression"
    penalty: "l2"
    solver: "lbfgs"
    max_iter: 1000
    c_regularization: 1.0
    tune_optuna: true
  stacking:
    n_splits: 5
    stratified: true
    leakage_guard: "strict_oof"
  base_models:
    deep_learning:
      include: true
      modes: ["full", "classical_matched"]
      epochs_per_fold: 3
    xgboost:
      n_estimators: 250
      max_depth: 7
      learning_rate: 0.06
      subsample: 0.85
      colsample_bytree: 0.85
    lightgbm:
      n_estimators: 250
      max_depth: 7
      num_leaves: 31
      learning_rate: 0.06
      subsample: 0.85
      colsample_bytree: 0.85
    random_forest:
      n_estimators: 150
      max_depth: 14
      class_weight: "balanced_subsample"
    logistic_regression:
      max_iter: 500
      class_weight: "balanced"
      scaler: "standard"

biomedical_model:
  ecg_branch:
    cnn_filters: [16, 32, 64]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 32
  ppg_branch:
    cnn_filters: [16, 32, 64]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 32
  respiration_branch:
    cnn_filters: [8, 16, 32]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 16
  fusion:
    latent_dim: 64
    gated_fusion: true
    dropout: 0.2

