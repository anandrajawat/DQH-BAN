# configs/models.yaml
cyber_model:
  cnn:
    filters: [32, 64, 128]
    kernel_sizes: [3, 5, 7]
    dropout: 0.2
    activation: "gelu"
  tcn:
    num_channels: [64, 64, 128]
    kernel_size: 3
    dropout: 0.2
    dilations: [1, 2, 4]
  bigru:
    hidden_size: 64
    num_layers: 1
    bidirectional: true
    dropout: 0.2
  attention:
    embed_dim: 128 # 64 * 2 from BiGRU
    num_heads: 4
    dropout: 0.1
  latent_dim: 64
  quantum_projection_dim: 4 # projected into quantum qubits

biomedical_model:
  ecg_branch:
    cnn_filters: [16, 32, 64]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 32
  ppg_branch:
    cnn_filters: [16, 32, 64]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 32
  respiration_branch:
    cnn_filters: [8, 16, 32]
    kernel_sizes: [7, 5, 3]
    gru_hidden: 16
  fusion:
    latent_dim: 64
    gated_fusion: true
    dropout: 0.2

