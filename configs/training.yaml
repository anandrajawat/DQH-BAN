# configs/training.yaml
training:
  epochs: 15
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 4
  min_delta: 0.001
  gradient_clip_norm: 1.0
  device: "mps" # Apple Silicon Metal Performance Shaders with CPU fallback
  
  loss:
    focal_gamma: 2.0
    focal_alpha: 0.25
    lambda_focal: 1.0
    lambda_fn: 0.5 # cost-sensitive false negative penalty
    lambda_reg: 0.0001
    
  optuna:
    n_trials: 10
    timeout_seconds: 600

  stacking:
    n_splits: 5
    stratified: true
    oof_validation: true
    refit_on_full_train: true

  calibration:
    methods: ["uncalibrated", "platt_scaling", "isotonic_regression"]
    target_max_fpr: 0.01
    evaluation_split: "validation_only"

